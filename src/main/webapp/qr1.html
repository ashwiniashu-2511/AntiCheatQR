<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Station 1 - QR Code</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            padding-top: 40px;
        }

        .box {
            background: white;
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px #aaa;
            box-sizing: border-box;
        }

        .qr {
            width: 350px;
            max-width: 90%;
            height: auto;
            margin: 20px;
        }
    </style>

</head>

<body>

<div class="box">

    <h1>📍 STATION 1</h1>

    <h2>Question 1</h2>

    <p>Scan this QR Code to start Question 1</p>

    <!-- PUBLIC QUESTION 1 QR CODE -->

    <img
        class="qr"
        src="https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=https://anticheatqr.onrender.com/QuestionServlet"
        alt="Question 1 QR Code">

    <h3>🔐 QR CODE 1</h3>

    <p>Scan using your mobile phone</p>

</div>

</body>

</html>
