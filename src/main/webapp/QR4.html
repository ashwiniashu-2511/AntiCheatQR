<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Station 4 - CRYPTEX</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            padding-top: 40px;
            margin: 0;
        }

        .box {
            background: white;
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px #aaa;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 5px;
        }

        h2 {
            color: #007bff;
        }

        .qr {
            width: 350px;
            max-width: 90%;
            height: auto;
            margin: 20px;
        }

        .station {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>📍 STATION 4</h1>

        <h2>Question 4</h2>

        <p class="station">
            Scan this QR Code to access Question 4
        </p>

        <img
            class="qr"
            src="https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=https://anticheatqr.onrender.com/Question4Servlet"
            alt="Question 4 QR Code">

        <h3>🔐 QR CODE 4</h3>

        <p>Scan using your mobile phone</p>

    </div>

</body>

</html>
