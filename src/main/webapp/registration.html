<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Event Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 60px;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 0 15px #aaa;
        }

        input {
            width: 85%;
            padding: 12px;
            margin: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🎯 Anti-Cheat QR Event</h1>

    <h2>Participant Registration</h2>

    <form action="RegisterServlet" method="post">

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required>

        <br>

        <input
            type="text"
            name="participantId"
            placeholder="Enter Participant ID"
            required>

        <br><br>

        <button type="submit">
            Start Event
        </button>

    </form>

</div>

</body>
</html>
