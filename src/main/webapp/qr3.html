<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Station 3 - QR Code</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            padding-top: 40px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px #aaa;
            box-sizing: border-box;
        }

        .qr {
            width: 300px;
            height: 300px;
            margin: 20px;
            max-width: 80%;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>📍 STATION 3</h1>

        <h2>Scan QR Code 3</h2>

        <p>
            Participants who completed Question 2 can scan this QR.
        </p>

        <!-- PUBLIC QUESTION 3 QR CODE -->

        <img
            class="qr"
            src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://anticheatqr.onrender.com/Question3Servlet"
            alt="QR Code 3">

        <h3>🔐 QR Code 3</h3>

        <p>Scan using your mobile phone</p>

    </div>

</body>

</html>
