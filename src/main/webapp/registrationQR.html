<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Registration QR</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            padding-top: 40px;
        }

        .box {
            background: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px #aaa;
        }

        .qr {
            width: 350px;
            height: 350px;
            margin: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🎯 ANTI-CHEAT QR EVENT</h1>

    <h2>📍 ENTRY / REGISTRATION</h2>

    <p>Scan this QR code to register for the event</p>

    <img
        class="qr"
        src="https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=http://172.30.48.9:8080/AntiCheatQR/registration.html"
        alt="Registration QR Code">

    <h3>🔐 REGISTRATION QR</h3>

    <p>Scan using your mobile phone</p>

</div>

</body>
</html>
